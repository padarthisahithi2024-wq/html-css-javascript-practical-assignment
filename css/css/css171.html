<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="analytics-components.css">
    <title>ML Anomaly Alert</title>
</head>
<body>
    <main class="page">
        <article class="card" style="border-left:5px solid var(--red)">
            <span class="badge" style="background:#fde9e9;color:var(--red)">High severity</span>
            <h1>Traffic anomaly detected</h1>
            <p>API requests are 48% above the expected range for this hour.</p>
            <p class="muted">Detected 4 minutes ago · Production cluster</p>
            <button class="btn primary">Investigate alert</button>
            <button class="btn">Snooze</button>
        </article>
    </main>
</body>
</html>
