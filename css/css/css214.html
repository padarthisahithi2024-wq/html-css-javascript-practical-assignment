<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="responsive-components.css">
<title>Responsive Data Table</title>
<style>table{width:100%;border-collapse:collapse;background:white}th,td{padding:14px;text-align:left;border-bottom:1px solid var(--line)}@media(max-width:600px){table{font-size:12px}th,td{padding:8px}.optional{display:none}}</style>
</head>
<body>
<main class="page"><h1>Responsive data table</h1><table><thead><tr><th>Project</th><th>Status</th><th class="optional">Owner</th><th>Progress</th></tr></thead><tbody><tr><td>Launch plan</td><td>Active</td><td class="optional">Alex</td><td>82%</td></tr><tr><td>Website refresh</td><td>Review</td><td class="optional">Jamie</td><td>64%</td></tr></tbody></table></main>
</body>
</html>
