<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="saas-components.css">
    <title>Loading State</title>
    <style>.loading{text-align:center;max-width:520px;margin:60px auto}.loader{width:38px;height:38px;margin:20px auto;border:4px solid #dfe3ff;border-top-color:var(--brand);border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style>
</head>
<body>
    <main class="page"><section class="loading card"><div class="loader"></div><h1>Loading dashboard</h1><p class="muted">Gathering your latest workspace data.</p></section></main>
</body>
</html>
