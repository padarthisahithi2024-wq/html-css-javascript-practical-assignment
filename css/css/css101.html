<body>
<main class="page">
<h1>SaaS usage analytics</h1>
<div class="grid">

<article class="card"><p class="muted">Sessions</p><p class="stat">81,430</p><span class="badge">↑ 8.7%</span></article>

</div>
<section class="card" style="margin-top:18px"><h2>Usage trend</h2><div class="line-chart"><svg viewBox="0 0 600 150" preserveAspectRatio="none"><polyline points="0,122 80,98 160,110 240,62 320,75 400,34 480,48 600,12" fill="none" stroke="#4353ff" stroke-width="5" /></svg></div></section>
