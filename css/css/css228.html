<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="responsive-components.css">
<title>Hover Effects</title>
</head>
<body>
<main class="page"><h1>Hover effects and micro-interactions</h1><div class="grid"><article class="card hover-card"><h2>Lift on hover</h2><p class="muted">Move over this card to reveal a small elevation effect.</p></article><button class="btn primary" style="transition:transform .2s,box-shadow .2s" onmouseover="this.style.transform='translateY(-3px)';this.style.boxShadow='0 8px 20px #4353ff55'" onmouseout="this.style.transform='';this.style.boxShadow=''">Hover action</button></div></main>
</body>
</html>
