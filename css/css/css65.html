<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="saas-components.css">
    <title>Toast Notifications</title>
    <style>.toast-stack{position:fixed;right:24px;bottom:24px;display:grid;gap:12px}.toast{padding:16px 20px;background:#172033;color:white;border-radius:8px;box-shadow:0 8px 24px #17203344}.toast strong{color:#8de0bd}</style>
</head>
<body>
    <main class="page">
        <h1>Toast notifications</h1>
        <p class="muted">Toast messages appear temporarily without interrupting the page.</p>
    </main>
    <div class="toast-stack">
        <div class="toast"><strong>Saved</strong><br>Changes were saved.</div>
        <div class="toast"><strong>Invite sent</strong><br>Alex joined your workspace.</div>
    </div>
</body>
</html>
