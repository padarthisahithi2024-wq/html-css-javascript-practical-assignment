<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="saas-components.css">
    <title>Form Validation</title>
    <style>form{max-width:520px;margin:auto;display:grid;gap:14px}input{padding:11px;border:2px solid var(--danger);border-radius:7px}.error-message{color:var(--danger);font-size:13px}</style>
</head>
<body>
    <main class="page"><form class="card"><h1>Profile details</h1><label>Work email<input type="email" value="not-an-email" aria-invalid="true"></label><p class="error-message">Enter a valid email address.</p><label>Display name<input type="text" aria-invalid="true"></label><p class="error-message">Display name is required.</p><button class="btn primary">Save changes</button></form></main>
</body>
</html>
