<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="analytics-components.css">
    <title>AI Response Card</title>
</head>
<body>
    <main class="page">
        <article class="card" style="max-width:760px;margin:auto">
            <div class="toolbar"><h1>AI response</h1><span class="badge">Generated</span></div>
            <p>Organic search drove the most revenue this quarter, contributing 42% of attributed revenue.</p>
            <hr>
            <p class="muted">Based on 84,290 sessions and 2,344 conversions.</p>
            <button class="btn outline">View sources</button>
            <button class="btn outline">Copy response</button>
        </article>
    </main>
</body>
</html>
