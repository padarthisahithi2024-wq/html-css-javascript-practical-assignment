<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="saas-components.css">
	<title>Admin Dashboard</title>
</head>
<body>
	<main class="page">
		<div class="topbar">
			<strong>Admin console</strong>
			<span class="muted">System status: <span class="badge">Healthy</span></span>
		</div>
		<div class="grid" style="margin-top:24px">
			<article class="card">
				<h2>Users</h2>
				<p class="stat">12,804</p>
				<p class="muted">+6.2% this month</p>
			</article>
			<article class="card">
				<h2>Open tickets</h2>
				<p class="stat">38</p>
				<p class="muted">8 need attention</p>
			</article>
			<article class="card">
				<h2>Service uptime</h2>
				<p class="stat">99.98%</p>
				<p class="muted">Last 30 days</p>
			</article>
		</div>
	</main>
</body>
</html>
