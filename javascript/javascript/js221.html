<!DOCTYPE html>
<html>
<head>
    <title>Shopping Order</title>
</head>
<body>

    <h2>Shopping Order</h2>

    Product:
    <select id="product">
        <option value="">Select Product</option>
        <option value="500">Bag - ₹500</option>
        <option value="1000">Shoes - ₹1000</option>
        <option value="1500">Watch - ₹1500</option>
    </select>

    <br><br>

    Quantity:
    <input type="number" id="quantity" min="1">

    <br><br>

    <button onclick="calculateTotal()">Calculate Total</button>

    <p id="result"></p>

    <script>
        function calculateTotal() {

            let price =
                Number(document.getElementById("product").value);

            let quantity =
                Number(document.getElementById("quantity").value);

            if (price == 0 || quantity <= 0) {
                alert("Select a product and enter quantity.");
                return;
            }

            let total = price * quantity;

            document.getElementById("result").innerHTML =
                "Total Price: ₹" + total;
        }
    </script>

</body>
</html>
