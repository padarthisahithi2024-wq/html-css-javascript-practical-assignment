<section class="card">

<h2>Program Description</h2>
<p>Stores a JavaScript object using JSON.</p>

<div class="demo">
    <button onclick="saveObject()">Save Object</button>
    <button onclick="showObject()">Display Object</button>
    <div id="out" class="output"></div>
</div>

<footer>Web Storage Project • Program 8 of 25</footer>

<script>
function saveObject() {
    let student = {
        name: "Sahithi",
        age: 18,
        course: "Computer Science"
    };

    localStorage.setItem(
        "student",
        JSON.stringify(student)
    );

    document.getElementById("out").textContent =
        "Student object saved successfully.";
}

function showObject() {
    let student = JSON.parse(
        localStorage.getItem("student")
    );

    if (student) {
        document.getElementById("out").textContent =
            "Name: " + student.name +
            " | Age: " + student.age +
            " | Course: " + student.course;
    }
}
</script>
