<!DOCTYPE html>
<html>
<head>
    <title>Double Click Counter</title>
</head>
<body>

    <h2>Double Click Counter</h2>

    <button id="button">Double Click Me</button>

    <p>Double Clicks: <span id="count">0</span></p>

    <script>
        let count = 0;

        document.getElementById("button").addEventListener(
            "dblclick",
            function() {
                count++;

                document.getElementById("count").textContent =
                    count;
            }
        );
    </script>

</body>
</html>
