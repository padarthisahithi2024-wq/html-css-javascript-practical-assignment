<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="js-lab.css">
<title>Show and Hide</title>
</head>
<body>
<main>
<h1>Show and hide an element</h1>
<button id="toggle">Hide message</button>
<p id="message">This message can be shown or hidden.</p>
<script>
    const output = document.querySelector(".output") || (() => {
        const element = document.createElement("p");
        element.className = "output";
        document.querySelector("main").append(element);
        return element;
    })();

    document.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => {
            output.textContent = `${button.textContent.trim()} clicked.`;
        });
    });

    document.querySelectorAll("form").forEach((form) => {
        form.addEventListener("submit", (event) => {
            event.preventDefault();
            output.textContent = "Form submitted successfully.";
        });
    });
</script>
</main>
</body>
</html>
