    <h1>21. Save Form Data Automatically</h1>
    <p>Web Storage • Working JavaScript Demonstration</p>

<main class="container">
<section class="card">

<h2>Program Description</h2>
<p>Automatically saves form data whenever the user types.</p>

<div class="demo">
    <input id="name" placeholder="Enter name">
    <input id="email" placeholder="Enter email">
    <textarea id="message" placeholder="Enter message"></textarea>
    <div id="out" class="output"></div>
</div>

<div class="page-nav">
    <a href="20.html">‹ Prev</a>
    <a class="middle" href="index.html">☰ All Programs</a>
    <a href="22.html">Next ›</a>
</div>

</section>
</main>

<footer>Web Storage Project • Program 21 of 25</footer>

<script>
let fields = ["name", "email", "message"];

fields.forEach(function(id) {

    let element = document.getElementById(id);

    element.value =
        localStorage.getItem(id) || "";

    element.addEventListener("input", function() {

        localStorage.setItem(
            id,
            element.value
        );

        document.getElementById("out").textContent =
            "Form data saved automatically.";
    });
});
</script>

</body>
