<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="js-lab.css">
	<title>Word Count</title>
</head>
<body>
	<main>
		<h1>Count words</h1>
		<p id="output"></p>
		<script>
			const sentence = "Learning JavaScript takes practice and patience.";
			const words = sentence.trim().split(/\s+/);
			document.getElementById("output").textContent = `Word count: ${words.length}`;
		</script>
	</main>
</body>
</html>
