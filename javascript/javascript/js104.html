<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="js-lab.css">
<title>Shopping Cart Storage</title>
</head>
<body>
<main>
<h1>Shopping cart with localStorage</h1>
<button id="add">Add notebook</button>
<p id="output">
</p>
<script>let cart=JSON.parse(localStorage.getItem("cart")||"[]");add.onclick=()=>{cart.push("Notebook");localStorage.setItem("cart",JSON.stringify(cart));output.textContent=`Cart items: ${cart.length}`;};output.textContent=`Cart items: ${cart.length}`;</script>
</main>
</body>
</html>
