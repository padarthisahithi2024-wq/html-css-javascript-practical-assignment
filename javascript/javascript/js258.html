<section class="card">

<h2>Program Description</h2>
<p>Adds products to a shopping cart and stores the cart.</p>

<div class="demo">
    <button onclick="addProduct('Laptop')">Add Laptop</button>
    <button onclick="addProduct('Headphones')">Add Headphones</button>
    <button onclick="addProduct('Mouse')">Add Mouse</button>
    <button onclick="showCart()">View Cart</button>
    <div id="out" class="output"></div>
</div>

<footer>Web Storage Project • Program 12 of 25</footer>

<script>
function addProduct(product) {
    let cart =
        JSON.parse(localStorage.getItem("cart")) || [];

    cart.push(product);

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

    document.getElementById("out").textContent =
        product + " added to cart.";
}

function showCart() {
    let cart =
        JSON.parse(localStorage.getItem("cart")) || [];

    document.getElementById("out").innerHTML =
        cart.length
        ? cart.join("<br>")
        : "Cart is empty.";
}
</script>
