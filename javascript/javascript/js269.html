<section class="card">

<h2>Program Description</h2>
<p>The shopping cart is saved in localStorage and remains after refresh.</p>

<div class="demo">
    <button onclick="add('Laptop')">Add Laptop</button>
    <button onclick="add('Keyboard')">Add Keyboard</button>
    <button onclick="add('Mouse')">Add Mouse</button>
    <button onclick="showCart()">Show Cart</button>
    <button onclick="clearCart()">Clear Cart</button>

    <div id="out" class="output"></div>
</div>

<footer>Web Storage Project • Program 23 of 25</footer>

<script>
function add(product) {
    let cart =
        JSON.parse(localStorage.getItem("persistentCart")) || [];

    cart.push(product);

    localStorage.setItem(
        "persistentCart",
        JSON.stringify(cart)
    );

    showCart();
}

function showCart() {
    let cart =
        JSON.parse(localStorage.getItem("persistentCart")) || [];

    document.getElementById("out").innerHTML =
        cart.length
        ? cart.join("<br>")
        : "Cart is empty.";
}

function clearCart() {
    localStorage.removeItem("persistentCart");
    showCart();
}

showCart();
</script>

</body>
