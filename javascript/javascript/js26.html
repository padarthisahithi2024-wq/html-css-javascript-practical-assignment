<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="js-lab.css">
<title>Change Image</title>
</head>
<body>
<main>
<h1>Change an image</h1>
<img id="photo" src="https://images.unsplash.com/photo-150752542640?auto=format&fit=crop&w=600&q=80" alt="Ocean view" width="500">
<br>
<button id="change">Change image</button>
<script>
    const output = document.querySelector(".output") || (() => {
        const element = document.createElement("p");
        element.className = "output";
        document.querySelector("main").append(element);
        return element;
    })();

    document.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => {
            output.textContent = `${button.textContent.trim()} clicked.`;
        });
    });

    document.querySelectorAll("form").forEach((form) => {
        form.addEventListener("submit", (event) => {
            event.preventDefault();
            output.textContent = "Form submitted successfully.";
        });
    });
</script>
</main>
</body>
</html>
