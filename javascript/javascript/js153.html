<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="js-lab.css">

    <title>DOM API Methods</title>
</head>

<body>

    <main>

        <h1>DOM API methods</h1>

        <div id="root">
            <p id="old">Original</p>
        </div>

        <button id="run">Run methods</button>

        <p id="output"></p>

        <script>
            run.onclick = () => {

                const child = document.createElement('p');

                child.textContent = 'Appended with appendChild';

                root.appendChild(child);

                old.remove();

                const replacement = document.createElement('strong');

                replacement.textContent = 'Replaced with replaceChild';

                root.replaceChild(replacement, child);

                output.textContent =
                    'createElement, appendChild, remove, and replaceChild completed.';
            };
        </script>

    </main>

</body>

</html>
