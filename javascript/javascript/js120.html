<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="js-lab.css">
    <title>Currency Converter</title>
</head>
<body>
    <main>
        <h1>Currency converter</h1>
        <input id="amount" type="number" value="100">
        <button id="convert">Convert INR to USD</button>
        <p id="output">
</p>
        <script>
            document.getElementById("convert").addEventListener("click", () => {
                document.getElementById("output").textContent = `USD ${(Number(document.getElementById("amount").value) * 0.012).toFixed(2)}`;
            });
        </script>
    </main>
</body>
</html>
