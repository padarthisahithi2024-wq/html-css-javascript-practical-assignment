<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="js-lab.css">
<title>Validate User Fields</title>
</head>
<body>
<main>
<h1>Validate name, email, phone, and password</h1>
<form id="form">
<label>Name<input id="name" required>
</label>
<label>Email<input id="email" type="email" required>
</label>
<label>Phone<input id="phone" pattern="[0-9]{10}" required>
</label>
<label>Password<input id="password" type="password" minlength="8" required>
</label>
<button>Validate</button>
</form>
<p class="output" id="output">
</p>
<script>
    const output = document.querySelector(".output") || (() => {
        const element = document.createElement("p");
        element.className = "output";
        document.querySelector("main").append(element);
        return element;
    })();

    document.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => {
            output.textContent = `${button.textContent.trim()} clicked.`;
        });
    });

    document.querySelectorAll("form").forEach((form) => {
        form.addEventListener("submit", (event) => {
            event.preventDefault();
            output.textContent = "Form submitted successfully.";
        });
    });
</script>
</main>
</body>
</html>
