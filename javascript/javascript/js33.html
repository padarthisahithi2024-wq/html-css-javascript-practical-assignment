<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="js-lab.css">
<title>Quiz Application</title>
</head>
<body>
<main>
<h1>Quick quiz</h1>
<p>Which keyword declares a constant?</p>
<label>
<input type="radio" name="answer" value="var"> var</label>
<label>
<input type="radio" name="answer" value="const"> const</label>
<label>
<input type="radio" name="answer" value="let"> let</label>
<br>
<button id="check">Check answer</button>
<p class="output" id="output">
</p>
<script>
    const output = document.querySelector(".output") || (() => {
        const element = document.createElement("p");
        element.className = "output";
        document.querySelector("main").append(element);
        return element;
    })();

    document.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => {
            output.textContent = `${button.textContent.trim()} clicked.`;
        });
    });

    document.querySelectorAll("form").forEach((form) => {
        form.addEventListener("submit", (event) => {
            event.preventDefault();
            output.textContent = "Form submitted successfully.";
        });
    });
</script>
</main>
</body>
</html>
