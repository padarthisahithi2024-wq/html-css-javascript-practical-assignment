<!DOCTYPE html>
<html>
<head>
    <title>Marks Calculator</title>
</head>
<body>

    <h2>Marks Calculator</h2>

    Subject 1:
    <input type="number" id="m1">
    <br><br>

    Subject 2:
    <input type="number" id="m2">
    <br><br>

    Subject 3:
    <input type="number" id="m3">
    <br><br>

    <button onclick="calculate()">Calculate</button>

    <p id="result"></p>

    <script>
        function calculate() {

            let m1 = Number(document.getElementById("m1").value);
            let m2 = Number(document.getElementById("m2").value);
            let m3 = Number(document.getElementById("m3").value);

            if (m1 < 0 || m1 > 100 ||
                m2 < 0 || m2 > 100 ||
                m3 < 0 || m3 > 100) {

                alert("Marks must be between 0 and 100.");
                return;
            }

            let total = m1 + m2 + m3;
            let average = total / 3;
            let grade;

            if (average >= 90)
                grade = "A";
            else if (average >= 75)
                grade = "B";
            else if (average >= 60)
                grade = "C";
            else if (average >= 50)
                grade = "D";
            else
                grade = "F";

            document.getElementById("result").innerHTML =
                "Total: " + total + "<br>" +
                "Average: " + average.toFixed(2) + "<br>" +
                "Grade: " + grade;
        }
    </script>

</body>
</html>
