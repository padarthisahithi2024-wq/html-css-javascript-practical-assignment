<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="js-lab.css">
<title>Theme Storage</title>
<style>body.dark{color:white;background:#172033}</style>
</head>
<body>
<main>
<h1>Theme switcher</h1>
<button id="toggle">Toggle theme</button>
<script>const theme=localStorage.getItem("theme")||"light";document.body.classList.toggle("dark",theme==="dark");toggle.onclick=()=>{const dark=!document.body.classList.contains("dark");document.body.classList.toggle("dark",dark);localStorage.setItem("theme",dark?"dark":"light");};</script>
</main>
</body>
</html>
