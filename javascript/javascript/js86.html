<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="js-lab.css">
    <title>Double-click Event</title>
</head>
<body>
    <main>
        <h1 id="target">Double-click this heading</h1>
        <p id="output"></p>
        <script>
            document.getElementById("target").addEventListener("dblclick", () => {
                document.getElementById("output").textContent = "Double-click event detected.";
            });
        </script>
    </main>
</body>
</html>
