<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="js-lab.css">
<title>Todo Application</title>
</head>
<body>
<main>
<h1>To-do list</h1>
<input id="task">
<button id="add">Add</button>
<ul id="list">
</ul>
<script>add.onclick=()=>{const item=document.createElement("li");item.textContent=task.value;list.append(item);task.value="";};</script>
</main>
</body>
</html>
