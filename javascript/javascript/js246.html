```html
<!DOCTYPE html>
<html>
<head>
    <title>Current URL</title>
</head>
<body>

    <h2>Display Current Webpage URL</h2>

    <button onclick="showURL()">Show URL</button>

    <p id="result"></p>

    <script>
        function showURL() {
            document.getElementById("result").innerHTML =
                window.location.href;
        }
    </script>

</body>
</html>
```
