<main class="container">
<section class="card">

<h2>Program Description</h2>
<p>Updates an existing username stored in localStorage.</p>

<div class="demo">
    <input id="name" placeholder="Enter new username">
    <button onclick="updateData()">Update Username</button>
    <div id="out" class="output"></div>
</div>

<div class="page-nav">
    <a href="02.html">‹ Prev</a>
    <a class="middle" href="index.html">☰ All Programs</a>
    <a href="04.html">Next ›</a>
</div>

</section>
</main>

<footer>Web Storage Project • Program 3 of 25</footer>

<script>
function updateData() {
    let value = document.getElementById("name").value;

    if (value === "") {
        document.getElementById("out").textContent =
            "Please enter a username.";
        return;
    }

    localStorage.setItem("username", value);

    document.getElementById("out").textContent =
        "Username updated successfully.";
}
</script>

</body>
