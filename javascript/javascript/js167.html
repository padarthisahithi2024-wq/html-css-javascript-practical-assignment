<!DOCTYPE html>
<html>
<head>
    <title>Reset Event</title>
</head>
<body>

    <h2>Reset Event</h2>

    <form id="form">
        <input type="text" placeholder="Enter name">

        <button type="reset">Reset</button>
    </form>

    <p id="output"></p>

    <script>
        document.getElementById("form").addEventListener(
            "reset",
            function() {
                document.getElementById("output").textContent =
                    "Form has been reset.";
            }
        );
    </script>

</body>
</html>
