<h2>Program Description</h2>
<p>Stores and retrieves an array using JSON.stringify() and JSON.parse().</p>

<div class="demo">
    <button onclick="saveArray()">Save Array</button>
    <button onclick="showArray()">Display Array</button>
    <div id="out" class="output"></div>
</div>

<footer>Web Storage Project • Program 7 of 25</footer>

<script>
function saveArray() {
    let subjects = ["HTML", "CSS", "JavaScript"];

    localStorage.setItem(
        "subjects",
        JSON.stringify(subjects)
    );

    document.getElementById("out").textContent =
        "Array saved successfully.";
}

function showArray() {
    let data = JSON.parse(
        localStorage.getItem("subjects")
    );

    document.getElementById("out").textContent =
        data ? data.join(", ") : "No array found.";
}
</script>
