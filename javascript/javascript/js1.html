<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hello World</title>
</head>
<body>
    <h1>JavaScript Output</h1>
    <p id="output"></p>
    <script>
        const message = "Hello World";
        document.getElementById("output").textContent = message;
        console.log(message);
    </script>
</body>
</html>
