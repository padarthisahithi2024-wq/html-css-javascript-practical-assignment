<!DOCTYPE html>
<html>
<head>
    <title>Input Event</title>
</head>
<body>

    <h2>Input Event</h2>

    <input id="input" placeholder="Type something">

    <p id="output"></p>

    <script>
        document.getElementById("input").addEventListener(
            "input",
            function() {
                document.getElementById("output").textContent =
                    "You typed: " + this.value;
            }
        );
    </script>

</body>
</html>
