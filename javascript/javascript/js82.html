<!DOCTYPE html>
<html>
<head>
    <title>Image Slideshow</title>

    <style>
        img {
            width: 500px;
            height: 300px;
            object-fit: cover;
        }

        button {
            margin: 10px;
            padding: 8px 15px;
        }
    </style>
</head>
<body>

<h2>Image Slideshow</h2>

<img id="slide" src="image1.jpg" alt="Slideshow Image">

<br>

<button onclick="previousImage()">Previous</button>
<button onclick="nextImage()">Next</button>

<script>
let images = [
    "image1.jpg",
    "image2.jpg",
    "image3.jpg",
    "image4.jpg"
];

let currentImage = 0;

function showImage() {
    document.getElementById("slide").src = images[currentImage];
}

function nextImage() {
    currentImage++;

    if (currentImage >= images.length) {
        currentImage = 0;
    }

    showImage();
}

function previousImage() {
    currentImage--;

    if (currentImage < 0) {
        currentImage = images.length - 1;
    }

    showImage();
}

// Automatically change image every 3 seconds
setInterval(nextImage, 3000);
</script>

</body>
</html>
