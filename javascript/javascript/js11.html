<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sum of Digits</title>
</head>
<body>
    <h1>Sum of digits</h1>
    <p id="output"></p>
    <script>
        const number = 4832;
        const sum = String(number)
            .split("")
            .reduce((total, digit) => total + Number(digit), 0);
        document.getElementById("output").textContent = `The sum of digits in ${number} is ${sum}.`;
    </script>
</body>
</html>
