<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Arithmetic Operations</title>
</head>
<body>
    <h1>Arithmetic operations</h1>
    <p id="output"></p>
    <script>
        const firstNumber = 20;
        const secondNumber = 6;
        const result = `Addition: ${firstNumber + secondNumber}, Subtraction: ${firstNumber - secondNumber}, Multiplication: ${firstNumber * secondNumber}, Division: ${firstNumber / secondNumber}`;
        document.getElementById("output").textContent = result;
    </script>
</body>
</html>
