<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Date and Math Objects</title>
</head>
<body>
    <h1>Date and Math objects</h1>
    <p id="output"></p>
    <script>
        const currentDate = new Date();
        const roundedNumber = Math.round(12.6);
        const randomNumber = Math.floor(Math.random() * 10) + 1;
        document.getElementById("output").textContent = `Date: ${currentDate.toLocaleDateString()}. Rounded value: ${roundedNumber}. Random value: ${randomNumber}.`;
    </script>
</body>
</html>
