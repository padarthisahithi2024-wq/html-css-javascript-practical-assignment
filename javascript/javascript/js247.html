<main class="container">
<section class="card">

<h2>Program Description</h2>
<p>Stores a username in the browser's localStorage.</p>

<div class="demo">
    <input id="name" placeholder="Enter username">
    <button onclick="save()">Save Username</button>
    <div id="out" class="output"></div>
</div>

<div class="page-nav">
    <a class="disabled" href="#">‹ Prev</a>
    <a class="middle" href="index.html">☰ All Programs</a>

</div>

</section>
</main>

<footer>Web Storage Project • Program 1 of 25</footer>

<script>
function save() {
    let v = document.getElementById("name").value;
    localStorage.setItem("username", v);
    document.getElementById("out").textContent =
        "Username saved successfully.";
}
</script>

</body>
