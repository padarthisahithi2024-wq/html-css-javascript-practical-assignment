<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="js-lab.css">
<title>Expense Tracker</title>
</head>
<body>
<main>
<h1>Expense tracker</h1>
<input id="amount" type="number">
<button onclick="total.textContent=Number(total.textContent||0)+Number(amount.value)">Add expense</button>
<p>Total: <strong id="total">0</strong>
</p>
</main>
</body>
</html>
