<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="js-lab.css">

    <title>Edit Delete Todo</title>
</head>

<body>

    <main>
        <h1>Add, edit, and delete to-do items</h1>

        <input id="task">

        <button id="add">Add</button>

        <ul id="list"></ul>

        <script>
            add.onclick = () => {
                const item = document.createElement('li');

                item.textContent = task.value;
                item.title = 'Click to edit';

                item.onclick = () => {
                    const value = prompt(
                        'Edit task',
                        item.textContent
                    );

                    if (value) {
                        item.textContent = value;
                    }
                };

                item.ondblclick = () => {
                    item.remove();
                };

                list.append(item);

                task.value = '';
            };
        </script>

    </main>

</body>

</html>
