<section class="card">

<h2>Program Description</h2>
<p>Stores recently viewed products in localStorage.</p>

<div class="demo">
    <button onclick="viewItem('Laptop')">View Laptop</button>
    <button onclick="viewItem('Phone')">View Phone</button>
    <button onclick="viewItem('Watch')">View Watch</button>
    <button onclick="showItems()">Recently Viewed</button>
    <div id="out" class="output"></div>
</div>

<footer>Web Storage Project • Program 16 of 25</footer>

<script>
function viewItem(item) {
    let items =
        JSON.parse(localStorage.getItem("recentItems")) || [];

    items = items.filter(function(value) {
        return value !== item;
    });

    items.unshift(item);

    items = items.slice(0, 5);

    localStorage.setItem(
        "recentItems",
        JSON.stringify(items)
    );

    document.getElementById("out").textContent =
        item + " viewed.";
}

function showItems() {
    let items =
        JSON.parse(localStorage.getItem("recentItems")) || [];

    document.getElementById("out").innerHTML =
        items.length
        ? items.join("<br>")
        : "No recently viewed items.";
}
</script>
