<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="js-lab.css">
    <title>Dynamic Attributes</title>
</head>
<body>
    <main>
        <img id="photo" src="https://images.unsplash.com/photo-150752542640?auto=format&fit=crop&w=500&q=80" alt="Ocean">
        <button id="change">Change alt attribute</button>
        <script>
            change.onclick = () => photo.setAttribute("alt", "Updated image description");
        </script>
    </main>
</body>
</html>
