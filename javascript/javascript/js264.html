<script>
function compareStorage() {
    localStorage.setItem("localData", "Permanent until cleared");
    sessionStorage.setItem("sessionData", "Temporary session data");

    document.getElementById("out").innerHTML =
        "localStorage: " +
        localStorage.getItem("localData") +
        "<br><br>" +
        "sessionStorage: " +
        sessionStorage.getItem("sessionData") +
        "<br><br>" +
        "localStorage normally remains after closing the browser, " +
        "while sessionStorage is associated with the current browser session.";
}
</script>
