<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>14. Dark Light Theme Switcher</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .dark {
            background: #222;
            color: white;
        }

        .dark .card {
            background: #333;
            color: white;
        }
    </style>
</head>

<body>

<div class="topbar">
    <div class="brand">WEB STORAGE LAB</div>
    <div class="topnav">
        <a href="../index.html">Home</a>
        <a href="index.html">Programs</a>
    </div>
</div>

<section class="hero">
    <h1>14. Dark/Light Theme Switcher</h1>
    <p>Web Storage • Working JavaScript Demonstration</p>
</section>

<main class="container">
<section class="card">

<h2>Program Description</h2>
<p>Saves the selected theme in localStorage.</p>

<div class="demo">
    <button onclick="setTheme('light')">Light Mode</button>
    <button onclick="setTheme('dark')">Dark Mode</button>
    <div id="out" class="output"></div>
</div>

<div class="page-nav">
    <a href="13.html">‹ Prev</a>
    <a class="middle" href="index.html">☰ All Programs</a>
    <a href="15.html">Next ›</a>
</div>

</section>
</main>

<footer>Web Storage Project • Program 14 of 25</footer>

<script>
function setTheme(theme) {
    localStorage.setItem("theme", theme);

    document.body.className =
        theme === "dark" ? "dark" : "";

    document.getElementById("out").textContent =
        theme + " mode selected.";
}

let savedTheme = localStorage.getItem("theme");

if (savedTheme === "dark") {
    document.body.className = "dark";
}
</script>

</body>
</html>
