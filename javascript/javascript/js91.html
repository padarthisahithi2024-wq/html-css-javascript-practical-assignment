<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="js-lab.css">
<title>Student Registration Validation</title>
</head>
<body>
<main>
<h1>Student registration</h1>
<form id="form">
<label>Name<input id="name" required>
</label>
<label>Email<input id="email" type="email" required>
</label>
<label>Course<input id="course" required>
</label>
<button>Register</button>
</form>
<p id="output">
</p>
<script>document.getElementById("form").addEventListener("submit",(event)=>{event.preventDefault();document.getElementById("output").textContent=event.currentTarget.checkValidity()?"Registration valid.":"Complete all fields.";});</script>
</main>
</body>
</html>
