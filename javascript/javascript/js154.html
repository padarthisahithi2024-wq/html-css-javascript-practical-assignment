<!DOCTYPE html>
<html>
<head>
    <title>Onclick Event</title>
</head>
<body>

    <h2>Onclick Event</h2>

    <button onclick="showMessage()">Click Me</button>

    <p id="output"></p>

    <script>
        function showMessage() {
            document.getElementById("output").textContent =
                "Button was clicked!";
        }
    </script>

</body>
</html>
