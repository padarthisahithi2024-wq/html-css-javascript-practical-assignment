    <p>Web Storage • Working JavaScript Demonstration</p>
</section>

<main class="container">
<section class="card">

<h2>Program Description</h2>
<p>Stores temporary form data using sessionStorage.</p>

<div class="demo">
    <input id="name" placeholder="Name">
    <input id="email" placeholder="Email">
    <button onclick="saveData()">Save Form Data</button>
    <button onclick="loadData()">Load Form Data</button>
    <div id="out" class="output"></div>
</div>

<div class="page-nav">
    <a href="18.html">‹ Prev</a>
    <a class="middle" href="index.html">☰ All Programs</a>
    <a href="20.html">Next ›</a>
</div>

</section>
</main>

<footer>Web Storage Project • Program 19 of 25</footer>

<script>
function saveData() {
    sessionStorage.setItem(
        "name",
        document.getElementById("name").value
    );

    sessionStorage.setItem(
        "email",
        document.getElementById("email").value
    );

    document.getElementById("out").textContent =
        "Form data saved temporarily.";
}

function loadData() {
    document.getElementById("name").value =
        sessionStorage.getItem("name") || "";

    document.getElementById("email").value =
        sessionStorage.getItem("email") || "";

    document.getElementById("out").textContent =
        "Form data loaded.";
}
</script>

</body>
