<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>.active{color:#4353ff;font-weight:bold}</style>
<title>CSS Classes</title>

<main>
