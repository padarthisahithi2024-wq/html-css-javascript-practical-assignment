<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="js-lab.css">
	<title>Change CSS Styles</title>
</head>
<body>
	<main>
		<h1 id="title">Dynamic styles</h1>
		<button id="style">Change style</button>
		<script>
			document.getElementById("style").addEventListener("click", () => {
				const title = document.getElementById("title");
				title.style.color = "#4353ff";
				title.style.transform = "translateX(20px)";
			});
		</script>
	</main>
</body>
</html>
