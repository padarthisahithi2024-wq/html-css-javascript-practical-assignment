<section class="card">

<h2>Program Description</h2>
<p>Retrieves the username stored in localStorage.</p>

<div class="demo">
    <button onclick="displayData()">Retrieve Username</button>
    <div id="out" class="output"></div>
</div>

<footer>Web Storage Project • Program 2 of 25</footer>

<script>
function displayData() {
    let value = localStorage.getItem("username");

    if (value) {
        document.getElementById("out").textContent =
            "Stored Username: " + value;
    } else {
        document.getElementById("out").textContent =
            "No username found.";
    }
}
</script>
