<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="js-lab.css">
<title>Guessing Game</title>
</head>
<body>
<main>
<h1>Number guessing game</h1>
<input id="guess" type="number">
<button onclick="output.textContent=Number(guess.value)===7?'Correct!':'Try again.'">Guess</button>
<p id="output">
</p>
</main>
</body>
</html>
