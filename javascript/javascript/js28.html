<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="js-lab.css">
<title>Calculator</title>
</head>
<body>
<main>
<h1>Simple calculator</h1>
<input id="first" type="number" value="12">
<select id="operator">
<option>+</option>
<option>-</option>
<option>*</option>
<option>/</option>
</select>
<input id="second" type="number" value="4">
<button id="calculate">Calculate</button>
<p class="output" id="output">
</p>
<script>
    const output = document.querySelector(".output") || (() => {
        const element = document.createElement("p");
        element.className = "output";
        document.querySelector("main").append(element);
        return element;
    })();

    document.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => {
            output.textContent = `${button.textContent.trim()} clicked.`;
        });
    });

    document.querySelectorAll("form").forEach((form) => {
        form.addEventListener("submit", (event) => {
            event.preventDefault();
            output.textContent = "Form submitted successfully.";
        });
    });
</script>
</main>
</body>
</html>
