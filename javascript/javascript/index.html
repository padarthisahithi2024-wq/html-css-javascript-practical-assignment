    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 10px;
        }

        header p {
            font-size: 16px;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .top-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .top-buttons button {
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            background: #2563eb;
            color: white;
            font-size: 15px;
        }

        .top-buttons button:hover {
            background: #1d4ed8;
        }

        .search-box {
            width: 100%;
            padding: 14px;
            margin-bottom: 25px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        .section {
            margin-bottom: 35px;
        }

        .section h2 {
            background: #111827;
            color: white;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .program-list {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }

        .program {
            background: white;
            padding: 18px;
            border-radius: 8px;
            border: 1px solid #ddd;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            transition: 0.2s;
        }

        .program:hover {
            transform: translateY(-3px);
            box-shadow:
                0 5px 12px rgba(0, 0, 0, 0.12);
        }

        .program-number {
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 8px;
        }

        .program-title {
            min-height: 45px;
            line-height: 1.4;
            margin-bottom: 12px;
        }

        .open-btn {
            display: inline-block;
            text-decoration: none;
            background: #16a34a;
            color: white;
            padding: 9px 15px;
            border-radius: 5px;
            font-size: 14px;
        }

        .open-btn:hover {
            background: #15803d;
        }

        .not-found {
            color: #dc2626;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }

        footer {
            margin-top: 40px;
            background: #1f2937;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 600px) {
            .container {
                width: 95%;
            }

            header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

        /*
         * Generate exactly js1.html to js272.html.
         */

        function getSection(number) {

            for (let section of sections) {

                if (
                    number >= section.start &&
                    number <= section.end
                ) {
                    return section;
                }
            }

            return {
                name: "JavaScript Program",
                className: "basic"
            };
        }


        function createPrograms() {

            const container =
                document.getElementById(
                    "programContainer"
                );

            container.innerHTML = "";

            for (
                let number = 1;
                number <= 272;
                number++
            ) {

                const section =
                    getSection(number);

                const title =
                    programs[number - 1] ||
                    "JavaScript Practical Program " +
                    number;

                if (
                    number === section.start
                ) {

                    const sectionDiv =
                        document.createElement("div");

                    sectionDiv.className =
                        "section";

                    sectionDiv.dataset.section =
                        section.className;

                    sectionDiv.innerHTML =
                        "<h2>" +
                        section.name +
                        "</h2>" +
                        "<div class='program-list'></div>";

                    container.appendChild(
                        sectionDiv
                    );
                }

                const allSections =
                    container.querySelectorAll(
                        ".section"
                    );

                const currentSection =
                    allSections[
                        allSections.length - 1
                    ];

                const list =
                    currentSection.querySelector(
                        ".program-list"
                    );

                const card =
                    document.createElement("div");

                card.className =
                    "program";

                card.dataset.number =
                    number;

                card.dataset.title =
                    title.toLowerCase();

                card.innerHTML = `
                    <div class="program-number">
                        Program ${number}
                    </div>

                    <div class="program-title">
                        ${title}
                    </div>

                    <a
                        class="open-btn"
                        href="js${number}.html"
                        target="_blank"
                    >
                        Open Program
                    </a>

                    <div
                        class="not-found"
                        id="error-${number}"
                    >
                        File: js${number}.html
                    </div>
                `;

                list.appendChild(card);
            }
        }


        function showAll() {

            const sections =
                document.querySelectorAll(
                    ".section"
                );

            sections.forEach(section => {
                section.style.display = "block";
            });

            const programs =
                document.querySelectorAll(
                    ".program"
                );

            programs.forEach(program => {
                program.style.display = "block";
            });

            document.getElementById(
                "search"
            ).value = "";
        }


        function showSection(sectionName) {

            const sections =
                document.querySelectorAll(
                    ".section"
                );

            sections.forEach(section => {

                if (
                    section.dataset.section ===
                    sectionName
                ) {
                    section.style.display =
                        "block";
                } else {
                    section.style.display =
                        "none";
                }
            });
        }


        function searchPrograms() {

            const search =
                document.getElementById(
                    "search"
                ).value.toLowerCase();

            const sections =
                document.querySelectorAll(
                    ".section"
                );

            sections.forEach(section => {

                let visibleCount = 0;

                const programs =
                    section.querySelectorAll(
                        ".program"
                    );

                programs.forEach(program => {

                    const number =
                        program.dataset.number;

                    const title =
                        program.dataset.title;

                    const match =
                        number.includes(search) ||
                        title.includes(search);

                    if (match) {

                        program.style.display =
                            "block";

                        visibleCount++;

                    } else {

                        program.style.display =
                            "none";
                    }
                });

                section.style.display =
                    visibleCount > 0
                        ? "block"
                        : "none";
            });
        }


        /*
         * Create the complete dashboard
         * when index.html loads.
         */

        createPrograms();
