<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="js-lab.css">
<title>Digital Calculator</title>
</head>
<body>
<main>
<h1>Digital calculator</h1>
<input id="a" type="number" value="8">
<input id="b" type="number" value="4">
<button id="go">Add</button>
<p id="output">
</p>
<script>go.onclick=()=>output.textContent=Number(a.value)+Number(b.value);</script>
</main>
</body>
</html>
