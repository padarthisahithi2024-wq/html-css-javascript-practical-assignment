    <p>Web Storage • Working JavaScript Demonstration</p>

<main class="container">
<section class="card">

<h2>Program Description</h2>
<p>Saves notes in localStorage.</p>

<div class="demo">
    <textarea id="note" placeholder="Write your note"></textarea>
    <button onclick="saveNote()">Save Note</button>
    <button onclick="showNote()">Show Note</button>
    <div id="out" class="output"></div>
</div>

<div class="page-nav">
    <a href="10.html">‹ Prev</a>
    <a class="middle" href="index.html">☰ All Programs</a>
    <a href="12.html">Next ›</a>
</div>

</section>
</main>

<footer>Web Storage Project • Program 11 of 25</footer>

<script>
function saveNote() {
    let note = document.getElementById("note").value;

    localStorage.setItem("note", note);

    document.getElementById("out").textContent =
        "Note saved successfully.";
}

function showNote() {
    let note = localStorage.getItem("note");

    document.getElementById("out").textContent =
        note || "No note found.";
}
</script>

</body>
