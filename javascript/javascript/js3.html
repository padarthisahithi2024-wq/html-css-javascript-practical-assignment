<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Largest of Three Numbers</title>
</head>
<body>
    <h1>Largest of three numbers</h1>
    <p id="output"></p>
    <script>
        const numbers = [18, 42, 27];
        const largest = Math.max(...numbers);
        document.getElementById("output").textContent = `Numbers: ${numbers.join(", ")}. Largest: ${largest}`;
    </script>
</body>
</html>
