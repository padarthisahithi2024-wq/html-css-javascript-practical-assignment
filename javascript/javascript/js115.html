<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="js-lab.css">
<title>Marks Calculator</title>
</head>
<body>
<main>
<h1>Student grade calculator</h1>
<input id="marks" type="number" value="82">
<button onclick="output.textContent=Number(marks.value)>=90?'A':Number(marks.value)>=75?'B':Number(marks.value)>=60?'C':'D'">Calculate grade</button>
<p id="output">
</p>
</main>
</body>
</html>
