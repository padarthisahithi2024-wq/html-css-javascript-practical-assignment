<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="js-lab.css">
	<title>Element Selection</title>
</head>
<body>
	<main>
		<h1 id="heading">Selection methods</h1>
		<p class="item">One</p>
		<p class="item">Two</p>
		<button id="show">Show counts</button>
		<p id="output"></p>
		<script>
			document.getElementById("show").addEventListener("click", () => {
				const heading = document.getElementById("heading");
				const items = document.getElementsByClassName("item");
				document.getElementById("output").textContent = `${heading.textContent}; class elements: ${items.length}`;
			});
		</script>
	</main>
</body>
</html>
