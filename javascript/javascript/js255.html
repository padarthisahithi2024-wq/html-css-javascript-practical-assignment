<main class="container">
<section class="card">

<h2>Program Description</h2>
<p>Adds and displays student records using localStorage.</p>

<div class="demo">
    <input id="name" placeholder="Student name">
    <input id="roll" placeholder="Roll number">
    <button onclick="addStudent()">Add Student</button>
    <button onclick="showStudents()">Display Students</button>
    <div id="out" class="output"></div>
</div>

<div class="page-nav">
    <a href="08.html">‹ Prev</a>

<footer>Web Storage Project • Program 9 of 25</footer>

<script>
function addStudent() {
    let students =
        JSON.parse(localStorage.getItem("students")) || [];

    let student = {
        name: document.getElementById("name").value,
        roll: document.getElementById("roll").value
    };

    students.push(student);

    localStorage.setItem(
        "students",
        JSON.stringify(students)
    );

    document.getElementById("out").textContent =
        "Student added successfully.";
}

function showStudents() {
    let students =
        JSON.parse(localStorage.getItem("students")) || [];

    document.getElementById("out").innerHTML =
        students.map(function(student) {
            return student.name + " - " + student.roll;
        }).join("<br>");
}
</script>

</body>
