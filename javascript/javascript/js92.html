<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="js-lab.css">
<title>Login Validation</title>
</head>
<body>
<main>
<h1>Login validation</h1>
<form id="form">
<label>Username<input id="username" required>
</label>
<label>Password<input id="password" type="password" minlength="8" required>
</label>
<button>Login</button>
</form>
<p id="output">
</p>
<script>document.getElementById("form").addEventListener("submit",(event)=>{event.preventDefault();const valid=event.currentTarget.checkValidity();document.getElementById("output").textContent=valid?"Login accepted.":"Use a username and an 8-character password.";});</script>
</main>
</body>
</html>
