<!DOCTYPE html>
<html>
<head>
    <title>Redirect to Another Webpage</title>
</head>

<body>

    <h2>Redirect Example</h2>

    <p>Click the button to visit Google.</p>

    <button onclick="redirectPage()">
        Go to Google
    </button>

    <script>
        function redirectPage() {
            window.location.href = "https://www.google.com";
        }
    </script>

</body>
</html>
