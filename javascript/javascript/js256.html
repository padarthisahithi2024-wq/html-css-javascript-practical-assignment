<section class="card">

<h2>Program Description</h2>
<p>Creates a simple to-do list that remains after refreshing.</p>

<div class="demo">
    <input id="task" placeholder="Enter a task">
    <button onclick="addTask()">Add Task</button>
    <div id="out" class="output"></div>
</div>

<div class="page-nav">
    <a href="09.html">‹ Prev</a>
    <a class="middle" href="index.html">☰ All Programs</a>

<footer>Web Storage Project • Program 10 of 25</footer>

<script>
function addTask() {
    let tasks =
        JSON.parse(localStorage.getItem("tasks")) || [];

    let task = document.getElementById("task").value;

    if (task === "") return;

    tasks.push(task);

    localStorage.setItem(
        "tasks",
        JSON.stringify(tasks)
    );

    document.getElementById("task").value = "";

    displayTasks();
}

function displayTasks() {
    let tasks =
        JSON.parse(localStorage.getItem("tasks")) || [];

    document.getElementById("out").innerHTML =
        tasks.map(function(task, index) {
            return (index + 1) + ". " + task;
        }).join("<br>");
}

displayTasks();
</script>
