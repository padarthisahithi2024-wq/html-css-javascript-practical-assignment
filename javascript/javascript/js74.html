<!DOCTYPE html>
<html>
<head>
    <title>Dynamic CSS Classes</title>
    <style>
        .highlight {
            background-color: yellow;
            color: red;
            padding: 10px;
        }
    </style>
</head>
<body>

<h2 id="text">Hello JavaScript!</h2>

<button onclick="addClass()">Add CSS Class</button>
<button onclick="removeClass()">Remove CSS Class</button>

<script>
function addClass() {
    document.getElementById("text").classList.add("highlight");
}

function removeClass() {
    document.getElementById("text").classList.remove("highlight");
}
</script>

</body>
</html>
