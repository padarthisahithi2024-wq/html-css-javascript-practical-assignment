<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="js-lab.css">
    <style>.active{background:#dff6f0}</style>
    <title>Toggle Class</title>
</head>
<body>
    <main>
        <p id="item">Toggle class</p>
        <button id="toggle">Toggle</button>
        <script>
            toggle.onclick = () => item.classList.toggle("active");
        </script>
    </main>
</body>
</html>
