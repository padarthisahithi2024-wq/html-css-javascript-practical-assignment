<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="js-lab.css">
<title>Random Password</title>
</head>
<body>
<main>
<h1>Random password generator</h1>
<button onclick="output.textContent=Array.from({length:12},()=>String.fromCharCode(33+Math.floor(Math.random()*90))).join('')">Generate</button>
<p id="output">
</p>
</main>
</body>
</html>
