<section class="hero">
    <h1>22. Restore Previously Entered Form Data</h1>
    <p>Web Storage • Working JavaScript Demonstration</p>
</section>

<main class="container">
<section class="card">

<h2>Program Description</h2>
<p>Restores form data after refreshing the webpage.</p>

<div class="demo">
    <input id="name" placeholder="Enter name">
    <input id="email" placeholder="Enter email">
    <button onclick="save()">Save Data</button>
    <button onclick="restore()">Restore Data</button>
    <div id="out" class="output"></div>
</div>

<div class="page-nav">
    <a href="21.html">‹ Prev</a>
    <a class="middle" href="index.html">☰ All Programs</a>
    <a href="23.html">Next ›</a>
</div>

</section>
</main>

<footer>Web Storage Project • Program 22 of 25</footer>

<script>
function save() {
    localStorage.setItem(
        "formName",
        document.getElementById("name").value
    );

    localStorage.setItem(
        "formEmail",
        document.getElementById("email").value
    );

    document.getElementById("out").textContent =
        "Data saved.";
}

function restore() {
    document.getElementById("name").value =
        localStorage.getItem("formName") || "";

    document.getElementById("email").value =
        localStorage.getItem("formEmail") || "";

    document.getElementById("out").textContent =
        "Previously entered data restored.";
}

restore();
</script>

</body>
