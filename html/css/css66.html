<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="saas-components.css">
    <title>Tooltips</title>
    <style>.tip{position:relative;display:inline-block}.tip span{visibility:hidden;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);padding:8px 10px;width:180px;background:#172033;color:white;border-radius:6px;text-align:center}.tip:hover span,.tip:focus span{visibility:visible}</style>
</head>
<body>
    <main class="page">
        <h1>Tooltip component</h1>
        <button class="btn primary tip">Hover for help<span>Invite teammates from the members page.</span></button>
    </main>
</body>
</html>
