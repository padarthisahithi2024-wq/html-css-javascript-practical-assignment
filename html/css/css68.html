<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="saas-components.css">
    <title>Modal Dialog</title>
    <style>.modal{max-width:460px;margin:40px auto}.modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}</style>
</head>
<body>
    <main class="page">
        <div class="modal card" role="dialog" aria-labelledby="modal-title">
            <h1 id="modal-title">Invite your team</h1>
            <p class="muted">Invite teammates to collaborate in this workspace.</p>
            <input style="width:100%;padding:10px;border:1px solid var(--line);border-radius:7px" type="email" placeholder="name@example.com">
            <div class="modal-footer"><button class="btn outline">Cancel</button><button class="btn primary">Send invite</button></div>
        </div>
    </main>
</body>
</html>
