<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="saas-components.css">
    <title>Registration Form</title>
    <style>form{max-width:620px;margin:auto;display:grid;gap:14px}input,select{padding:11px;border:1px solid var(--line);border-radius:7px}</style>
</head>
<body>
    <main class="page"><form class="card"><h1>Register for the workshop</h1><label>Name<input type="text" required></label><label>Email<input type="email" required></label><label>Role<select><option>Developer</option><option>Designer</option><option>Manager</option></select></label><label>Company<input type="text"></label><button class="btn primary">Register</button></form></main>
</body>
</html>
