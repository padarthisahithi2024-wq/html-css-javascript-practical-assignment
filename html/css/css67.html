<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="saas-components.css">
    <title>Popover</title>
    <style>.popover{position:relative;display:inline-block}.popover:focus-within .popover-panel{display:block}.popover-panel{display:none;position:absolute;top:calc(100% + 10px);left:0;width:260px;padding:16px;background:white;border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 25px #17203322;z-index:2}</style>
</head>
<body>
    <main class="page">
        <h1>Popover component</h1>
        <div class="popover">
            <button class="btn outline">Workspace details</button>
            <div class="popover-panel"><strong>Orbit workspace</strong><p class="muted">12 members · Pro plan</p><a href="#">Manage workspace</a></div>
        </div>
    </main>
</body>
</html>
