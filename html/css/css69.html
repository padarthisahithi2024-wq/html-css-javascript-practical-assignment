<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="saas-components.css">
    <title>Confirmation Dialog</title>
</head>
<body>
    <main class="page">
        <div class="card" style="max-width:460px;margin:40px auto">
            <span class="badge" style="background:#fde9e9;color:var(--danger)">Destructive action</span>
            <h1>Delete project?</h1>
            <p class="muted">This permanently removes the project and all of its data.</p>
            <button class="btn outline">Cancel</button>
            <button class="btn danger">Delete project</button>
        </div>
    </main>
</body>
</html>
