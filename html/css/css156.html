<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="agent-components.css">
    <title>Agent Configuration</title>
</head>
<body>
    <main class="page">
        <form class="card" style="max-width:760px;margin:auto">
            <h1>Agent configuration</h1>
            <label>Model<select style="width:100%;margin:8px 0 16px"><option>Orbit Reasoning v2</option><option>Orbit Fast v1</option></select></label>
            <label>Temperature<input style="width:100%;margin:8px 0 16px" type="range" min="0" max="1" step=".1" value=".3"></label>
            <label><input type="checkbox" checked> Require citations in responses</label>
            <label><input type="checkbox" checked> Log every execution</label>
            <button class="btn primary" style="margin-top:16px">Save configuration</button>
        </form>
    </main>
</body>
</html>
