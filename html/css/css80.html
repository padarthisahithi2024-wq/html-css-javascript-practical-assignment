<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="saas-components.css">
    <title>Timeline Activity</title>
    <style>.timeline{border-left:2px solid #dfe3ff;padding-left:24px}.event{position:relative;margin:24px 0}.event::before{content:"";position:absolute;left:-33px;top:4px;width:14px;height:14px;border:3px solid white;border-radius:50%;background:var(--brand);box-shadow:0 0 0 2px var(--brand)}</style>
</head>
<body>
    <main class="page"><h1>Activity history</h1><div class="timeline"><article class="event"><strong>Project created</strong><p class="muted">Alex created Launch plan · Today, 9:12 AM</p></article><article class="event"><strong>Teammate invited</strong><p class="muted">Jamie joined the project · Yesterday</p></article><article class="event"><strong>Report exported</strong><p class="muted">A CSV report was downloaded · Monday</p></article></div></main>
</body>
</html>
