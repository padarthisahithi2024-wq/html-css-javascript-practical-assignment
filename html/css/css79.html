<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="saas-components.css">
    <title>Progress Stepper</title>
    <style>.steps{display:flex;justify-content:space-between;max-width:760px}.step{flex:1;text-align:center;position:relative}.step:not(:last-child)::after{content:"";position:absolute;top:18px;left:60%;width:80%;height:2px;background:var(--line)}.step.done:not(:last-child)::after{background:var(--brand)}.dot{position:relative;z-index:1;margin:auto;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:white;border:2px solid var(--line)}.done .dot{background:var(--brand);border-color:var(--brand);color:white}</style>
</head>
<body>
    <main class="page"><h1>Launch checklist</h1><div class="steps"><div class="step done"><div class="dot">✓</div><p>Details</p></div><div class="step done"><div class="dot">✓</div><p>Invite</p></div><div class="step"><div class="dot">3</div><p>Review</p></div><div class="step"><div class="dot">4</div><p>Launch</p></div></div></main>
</body>
</html>
