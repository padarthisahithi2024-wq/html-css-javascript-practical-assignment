<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="saas-components.css">
    <title>Contact Form</title>
    <style>form{max-width:620px;margin:auto;display:grid;gap:14px}input,textarea{padding:11px;border:1px solid var(--line);border-radius:7px;font:inherit}</style>
</head>
<body>
    <main class="page"><form class="card"><h1>Contact support</h1><label>Name<input type="text" required></label><label>Email<input type="email" required></label><label>Message<textarea rows="5" required></textarea></label><button class="btn primary">Send message</button></form></main>
</body>
</html>
