<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="saas-components.css">
    <title>Alerts</title>
    <style>.alert{padding:16px;border-radius:8px;margin:12px 0}.info{background:#e8f1ff;color:#2457a6}.warning{background:#fff4d6;color:#7c5b00}.error{background:#fde9e9;color:#a33232}</style>
</head>
<body>
    <main class="page">
        <h1>Alerts and notifications</h1>
        <div class="alert info"><strong>Information:</strong> Your report is ready.</div>
        <div class="alert warning"><strong>Warning:</strong> Your trial ends in three days.</div>
        <div class="alert error"><strong>Error:</strong> We could not sync the workspace.</div>
    </main>
</body>
</html>
