<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="responsive-components.css">
<title>Responsive SaaS Form</title>
<style>form{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;max-width:760px;margin:auto}label{display:grid;gap:6px}.full{grid-column:1/-1}@media(max-width:600px){form{grid-template-columns:1fr}.full{grid-column:auto}}</style>
</head>
<body>
<main class="page"><form class="card"><h1 class="full">Create workspace</h1><label>First name<input required></label><label>Last name<input required></label><label class="full">Work email<input type="email" required></label><label class="full">Workspace name<input required></label><button class="btn primary full">Continue</button></form></main>
</body>
</html>
