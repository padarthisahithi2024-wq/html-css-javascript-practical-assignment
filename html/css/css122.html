<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="analytics-components.css">
    <title>AI Prompt Input</title>
</head>
<body>
    <main class="page">
        <section class="card" style="max-width:760px;margin:auto">
            <h1>Ask your analytics assistant</h1>
            <p class="muted">Describe the insight or report you need in plain language.</p>
            <textarea style="width:100%;padding:12px;border:1px solid var(--line);border-radius:7px;font:inherit" rows="5" placeholder="Show me our best-performing customer segment..."></textarea>
            <div class="toolbar" style="margin-top:14px"><span class="muted">Shift + Enter for a new line</span><button class="btn primary">Generate answer</button></div>
        </section>
    </main>
</body>
</html>
