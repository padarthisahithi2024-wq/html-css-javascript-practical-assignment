<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="analytics-components.css">
    <title>ML Outlier Detection</title>
</head>
<body>
    <main class="page">
        <h1>Outlier detection</h1>
        <section class="card">
            <div class="row"><h2>Customer order values</h2><span class="badge">5 outliers</span></div>
            <p class="muted">Most values fall between $24 and $180.</p>
            <p><strong>Order #4821</strong> · $4,820 <span class="badge" style="background:#fde9e9;color:var(--red)">Outlier</span></p>
            <p><strong>Order #4790</strong> · $3,410 <span class="badge" style="background:#fde9e9;color:var(--red)">Outlier</span></p>
            <button class="btn primary">Review outliers</button>
        </section>
    </main>
</body>
</html>
