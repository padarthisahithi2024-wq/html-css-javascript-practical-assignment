<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="saas-components.css">
    <title>Skeleton Loading</title>
    <style>.skeleton{height:14px;margin:14px 0;border-radius:5px;background:linear-gradient(90deg,#edf0f4,#f8fafc,#edf0f4);background-size:200% 100%;animation:shimmer 1.4s infinite}.short{width:40%}.medium{width:65%}@keyframes shimmer{to{background-position:-200% 0}}</style>
</head>
<body>
    <main class="page"><article class="card"><div class="skeleton short"></div><div class="skeleton medium"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton short"></div></article></main>
</body>
</html>
