<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="saas-components.css">
    <title>Drawer Panel</title>
    <style>.drawer{position:fixed;right:0;top:0;height:100vh;width:min(380px,90vw);padding:28px;background:white;box-shadow:-12px 0 30px #17203322}</style>

<body>
    <main class="page">
        <h1>Slide-out drawer</h1>
        <p class="muted">A drawer keeps secondary settings available beside the main content.</p>
    </main>
    <aside class="drawer"><h2>Filters</h2><label><input type="checkbox" checked> Active projects</label><br><label><input type="checkbox"> Archived projects</label><hr><button class="btn primary">Apply filters</button></aside>
</body>
