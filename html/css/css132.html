<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="analytics-components.css">
    <title>AI Content Generator</title>
</head>
<body>
    <main class="page">
        <section class="card" style="max-width:800px;margin:auto">
            <h1>Content generator</h1>
            <label>Describe what you need<textarea style="width:100%;margin-top:8px;padding:12px;border:1px solid var(--line);border-radius:7px" rows="4" placeholder="Write a product update for our Pro plan..."></textarea></label>
            <div class="row" style="margin-top:16px"><select><option>Product update</option><option>Email</option><option>Social post</option></select><button class="btn primary">Generate content</button></div>
        </section>
    </main>
</body>
</html>
