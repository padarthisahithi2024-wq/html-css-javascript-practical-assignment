<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="saas-components.css">
    <title>Command Palette</title>
    <style>.command{max-width:620px;margin:30px auto;overflow:hidden}.command input{width:100%;padding:16px;border:0;border-bottom:1px solid var(--line);font-size:18px}.command a{display:block;padding:12px 16px}.command a:hover{background:#edf0ff}</style>
</head>
<body>
    <main class="page">
        <div class="command card">
            <input type="search" placeholder="Search commands...">
            <a href="#">Create new project <span class="muted">Ctrl K</span></a>
            <a href="#">Invite teammate <span class="muted">I</span></a>
            <a href="#">Open settings <span class="muted">S</span></a>
        </div>
    </main>
</body>
</html>
